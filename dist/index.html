    <title>玄城夜行：九幽录</title>
    <script>
      (function () {
        try {
          var isStandalone =
            window.navigator.standalone === true ||
            (window.matchMedia &&
              (window.matchMedia('(display-mode: standalone)').matches ||
                window.matchMedia('(display-mode: fullscreen)').matches));
          if (isStandalone) {
            document.documentElement.classList.add('is-standalone-webapp');
          }
        } catch (e) {}
      })();
      window.__xuanchengDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__xuanchengDeferredPrompt = e;
        window.dispatchEvent(new Event('xuancheng-bip-ready'));
      });
      if ('serviceWorker' in navigator) {
        var hadSwController = Boolean(navigator.serviceWorker.controller);
        var swReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadSwController || swReloading) return;
          if (document.querySelector('.zx-hud')) return;
          swReloading = true;
          window.location.reload();
        });
        navigator.serviceWorker
          .register('./sw.js?v=15', { updateViaCache: 'none' })
          .then(function (reg) {
            reg.update().catch(function () {});
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') {
                reg.update().catch(function () {});
              }
            });
          })
          .catch(function () {});
      }
    </script>
    <script type="module" crossorigin src="./assets/index-DeEfUbZr.js"></script>

  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer"></div>

      <div id="boot-loader" role="status" aria-live="polite">
        <div class="boot-card">
          <span class="boot-seal">镇妖司密卷 · 卷壹</span>
          <h1>玄城夜行：九幽录</h1>
          <p class="boot-sub">甲子血月重临 · 少年李逸承夜闯九幽玄城</p>
          <div class="boot-bar-track">
            <div id="boot-bar-fill"></div>
          </div>
          <div class="boot-pct-row">
            <span id="boot-status">正在研墨铺卷...</span>
            <span id="boot-pct">15%</span>
          </div>
        </div>
      </div>

      <div id="landscape-guard" class="landscape-guard" aria-hidden="true">
        <div class="landscape-guard-card">
          <div class="rotate-icon">📱 ↻</div>
          <h2>请横置手机进入玄城</h2>
          <p>横屏全视野更利于观察机关地形与手搓武学连招</p>
          <button id="btn-guard-landscape" class="btn-guofeng btn-crimson" type="button">
            ⛶ 开启全屏并锁定横屏
          </button>
        </div>
      </div>
    </div>
